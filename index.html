<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growebtek AI Stock &amp; Fund Analyzer</title>
<meta name="description" content="Growebtek AI Stock & Fund Analyzer: live Indian and US market reports, stock analysis and comparison, mutual fund analysis and comparison.">
<meta name="theme-color" content="#6d5efc">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.hero{padding:34px 0 10px;text-align:center}
.hero-logo{display:block;margin:0 auto 14px;height:clamp(96px,16vw,130px);width:auto;background:#fff;border-radius:20px;padding:6px 12px;box-shadow:0 10px 30px rgba(30,64,175,.12)}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:-.035em}
.hero h1 span{background:var(--gw-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--gw-ink-2);font-size:clamp(15px,2vw,17px);max-width:620px;margin:12px auto 0}
.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.auth{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin:26px auto 0;max-width:940px;align-items:start}
@media (max-width:820px){.auth{grid-template-columns:1fr}}
.devcard{background:var(--gw-grad);color:#fff;border:0;position:relative;overflow:hidden}
.devcard::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.devcard h2{color:#fff}
.devid{font:800 clamp(20px,4.2vw,28px) var(--gw-mono);letter-spacing:.08em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:14px 16px;margin:6px 0 14px;word-break:break-all;position:relative;z-index:1}
.devcard p{color:rgba(255,255,255,.92);font-size:14px;position:relative;z-index:1}
.devcard .gw-btn{background:#fff;color:#5b21b6;box-shadow:0 8px 20px rgba(0,0,0,.15);position:relative;z-index:1}
.devcard .steps{margin:14px 0 0;padding-left:22px;font-size:14px;color:rgba(255,255,255,.95);position:relative;z-index:1}
.devcard .steps li{margin:4px 0}
.tabs{display:flex;background:var(--gw-soft);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;font:800 14px var(--gw-sans);color:var(--gw-ink-2);height:40px;border-radius:11px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--gw-indigo);box-shadow:0 2px 8px rgba(60,64,140,.12)}
.pw{position:relative}.pw .gw-input{padding-right:64px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font:700 12px var(--gw-sans);color:var(--gw-indigo);cursor:pointer;padding:6px}
.note{font-size:13px;color:var(--gw-ink-3);margin-top:12px}
.banner{max-width:940px;margin:18px auto 0;padding:12px 16px;border-radius:14px;background:#fff4dc;color:#7a4a00;font-weight:600;font-size:14px;border:1px solid #f6dfa8}
/* dashboard */
.welcome{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:30px 0 6px}
.welcome h1{font-size:clamp(24px,4vw,34px);font-weight:900}
.welcome h1 span{background:var(--gw-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
@media (max-width:620px){.tiles{grid-template-columns:1fr}}
.gw .tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:190px;padding:24px;border-radius:24px;color:#fff;text-decoration:none;overflow:hidden;box-shadow:0 14px 34px var(--sh);transition:transform .2s,box-shadow .2s}
.gw .tile:hover{transform:translateY(-4px);box-shadow:0 20px 44px var(--sh)}
.tile::before{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.tile::after{content:"";position:absolute;right:60px;top:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.tile .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:28px;position:relative;z-index:1}
.tile h3{font-size:22px;font-weight:900;color:#fff;position:relative;z-index:1}
.tile p{font-size:14px;opacity:.93;margin-top:4px;position:relative;z-index:1}
.tile .go{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:rgba(255,255,255,.22);padding:7px 14px;border-radius:999px;align-self:flex-start}
.t1{background:linear-gradient(135deg,#ff8a3d,#f43f5e);--sh:rgba(244,63,94,.28)}
.t2{background:linear-gradient(135deg,#3b82f6,#6366f1);--sh:rgba(99,102,241,.3)}
.t3{background:linear-gradient(135deg,#8b5cf6,#ec4899);--sh:rgba(168,85,247,.3)}
.t4{background:linear-gradient(135deg,#10b981,#0ea5e9);--sh:rgba(16,185,129,.3)}
/* admin */
.admin{margin-top:30px}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.admin-head h2{font-size:22px;font-weight:900}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px;margin-bottom:14px}
.quick button{border:1px solid var(--gw-line);background:#fff;border-radius:999px;padding:4px 10px;font:700 12px var(--gw-sans);color:var(--gw-ink-2);cursor:pointer}
.quick button:hover{border-color:var(--gw-indigo);color:var(--gw-indigo)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--gw-line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:900}.stat span{font-size:12px;font-weight:700;color:var(--gw-ink-3);text-transform:uppercase;letter-spacing:.05em}
.act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.act button{border:1px solid var(--gw-line);background:#fff;border-radius:9px;height:30px;padding:0 10px;font:700 12px var(--gw-sans);cursor:pointer;color:var(--gw-ink-2)}
.act button:hover{border-color:var(--gw-indigo);color:var(--gw-indigo)}
.act button.del:hover{border-color:var(--gw-red);color:var(--gw-red);background:var(--gw-dn-bg)}
.mono{font-family:var(--gw-mono);font-size:13px;letter-spacing:.03em}
.empty{text-align:center;color:var(--gw-ink-3);padding:26px 10px}
@media (max-width:720px){
  .utbl thead{display:none}
  .utbl tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--gw-line)}
  .utbl td{border:0;padding:0}
  .utbl td.c-act{grid-column:1/-1;margin-top:6px}.utbl .act{justify-content:flex-start}
}
[hidden]{display:none!important}
</style>
</head>
<body class="gw">
<div id="app"></div>
<footer class="gw-foot">© <span id="yr"></span> Growebtek AI Stock &amp; Fund Analyzer · For information and education only · Not investment advice</footer>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = GW.esc, app = $('#app');
  $('#yr').textContent = new Date().getFullYear();
  var users = [], editing = null;

  function btnBusy(b, on, label) { b.disabled = on; b.innerHTML = on ? '<span class="gw-spin"></span> Please wait…' : label; }
  function todayIst() { return new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10); }
  function addMonths(n) { var d = new Date(Date.now() + 5.5 * 3600e3); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); }
  function fmtDate(ymd) { if (!ymd) return '–'; var d = new Date(ymd + 'T00:00:00'); return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function daysLeft(ymd) { return Math.floor((Date.parse(ymd + 'T23:59:59+05:30') - Date.now()) / 864e5); }

  // ---------------------------------------------------------------- logged out
  function renderLogin(msg) {
    var id = GW.deviceId();
    app.innerHTML =
      '<div class="gw-bar"><div class="gw-bar-in">' + GW.logoHtml('Smart market insights') + '</div></div>' +
      '<div class="gw-wrap">' +
      (msg ? '<div class="banner" role="status">' + esc(msg) + '</div>' : '') +
      '<section class="hero"><img class="hero-logo" src="assets/logo.png" alt="Growebtek IT Solutions"><h1>Growebtek <span>AI Stock &amp; Fund Analyzer</span></h1>' +
      '<p>Live Indian and US market reports, deep stock analysis and mutual fund insights. Clear, colourful and always up to date.</p>' +
      '<div class="feat"><span class="gw-chip pink">🇮🇳 India report</span><span class="gw-chip indigo">🇺🇸 US report</span><span class="gw-chip amber">📊 Stock analyzer</span><span class="gw-chip green">💰 Fund analyzer</span></div></section>' +
      '<div class="auth">' +
      '<section class="gw-card devcard" aria-labelledby="devh"><h2 id="devh">Your Device ID</h2>' +
      '<p>This ID is unique to this device and browser.</p>' +
      '<div class="devid" id="devid">' + GW.prettyId(id) + '</div>' +
      '<button class="gw-btn" type="button" data-gw-copy><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy Device ID</button>' +
      '<ol class="steps"><li>Copy your Device ID.</li><li>Send it to the admin with your mobile number.</li><li>Once approved, log in with your mobile number.</li></ol></section>' +
      '<section class="gw-card" aria-label="Login">' +
      '<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="user">User login</button><button role="tab" aria-selected="false" data-tab="admin">Admin login</button></div>' +
      '<form id="f-user" novalidate><div class="gw-field"><label for="u-mob">Mobile number</label><input class="gw-input" id="u-mob" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" maxlength="14"></div>' +
      '<div class="gw-err" id="u-err" role="alert"></div><button class="gw-btn" style="width:100%" type="submit">Login</button>' +
      '<p class="note">Access works only on the device whose ID the admin approved.</p></form>' +
      '<form id="f-admin" novalidate hidden><div class="gw-field"><label for="a-mob">Admin mobile number</label><input class="gw-input" id="a-mob" inputmode="numeric" autocomplete="username" placeholder="10-digit mobile number" maxlength="14"></div>' +
      '<div class="gw-field"><label for="a-pw">Password</label><div class="pw"><input class="gw-input" id="a-pw" type="password" autocomplete="current-password" placeholder="Admin password"><button type="button" id="a-eye">Show</button></div></div>' +
      '<div class="gw-err" id="a-err" role="alert"></div><button class="gw-btn" style="width:100%" type="submit">Login as admin</button></form>' +
      '</section></div></div>';

    app.querySelectorAll('[data-tab]').forEach(function (b) {
      b.onclick = function () {
        app.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
        $('#f-user').hidden = b.dataset.tab !== 'user'; $('#f-admin').hidden = b.dataset.tab !== 'admin';
        (b.dataset.tab === 'user' ? $('#u-mob') : $('#a-mob')).focus();
      };
    });
    $('#a-eye').onclick = function () { var i = $('#a-pw'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'Show' : 'Hide'; };
    $('#f-user').onsubmit = function (e) {
      e.preventDefault();
      var m = $('#u-mob').value.replace(/\D/g, ''), err = $('#u-err'), b = this.querySelector('button[type=submit]');
      if (m.length > 10) m = m.slice(-10);
      if (m.length !== 10) { err.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
      err.textContent = ''; btnBusy(b, true);
      GW.api('userLogin', { mobile: m }, { noRedirect: true }).then(function (r) { GW.setSession(r); route(); })
        .catch(function (x) { err.textContent = x.message; btnBusy(b, false, 'Login'); });
    };
    $('#f-admin').onsubmit = function (e) {
      e.preventDefault();
      var m = $('#a-mob').value.replace(/\D/g, ''), pw = $('#a-pw').value, err = $('#a-err'), b = this.querySelector('button[type=submit]');
      if (m.length < 10 || !pw) { err.textContent = 'Enter the admin mobile number and password.'; return; }
      err.textContent = ''; btnBusy(b, true);
      GW.api('adminLogin', { mobile: m, password: pw }, { noRedirect: true }).then(function (r) { GW.setSession(r); route(); })
        .catch(function (x) { err.textContent = x.message; btnBusy(b, false, 'Login as admin'); });
    };
  }

  // ---------------------------------------------------------------- dashboard
  var TILES = [
    ['india/', 't1', '🇮🇳', 'India Stock Market Report', 'Nifty, Sensex, sectors, movers, news and outlook — live.'],
    ['us/', 't2', '🇺🇸', 'US Stock Market Report', 'S&P 500, Dow, Nasdaq, sectors, movers, news and outlook.'],
    ['analyzer/', 't3', '📊', 'Stock Analyzer', 'Full analysis of any stock worldwide, plus side-by-side comparison.'],
    ['funds/', 't4', '💰', 'Mutual Fund Analyzer', 'Returns, risk, consistency and comparison of mutual funds.']
  ];
  function renderDash(s) {
    var isAdmin = s.role === 'admin';
    app.innerHTML = '';
    GW.appBar({ home: false, sub: isAdmin ? 'Admin' : 'Welcome' });
    var w = document.createElement('div'); w.className = 'gw-wrap'; app.appendChild(w);
    var dl = s.expiry ? daysLeft(s.expiry) : null;
    w.innerHTML = '<div class="welcome"><div><h1>Hello <span>' + (isAdmin ? 'Admin' : esc(s.name || 'there')) + '</span> 👋</h1>' +
      '<p class="muted" style="margin-top:4px">What would you like to explore today?</p></div>' +
      (isAdmin ? '<span class="gw-chip indigo">Admin access</span>' : s.expiry ? '<span class="gw-chip ' + (dl <= 7 ? 'amber' : 'green') + '">Access till ' + fmtDate(s.expiry) + (dl <= 7 ? ' · ' + Math.max(dl, 0) + ' day' + (dl === 1 ? '' : 's') + ' left' : '') + '</span>' : '') + '</div>' +
      '<nav class="tiles" aria-label="Sections">' + TILES.map(function (t) {
        return '<a class="tile ' + t[1] + '" href="' + t[0] + '"><span class="ic" aria-hidden="true">' + t[2] + '</span><span><h3>' + t[3] + '</h3><p>' + esc(t[4]) + '</p></span><span class="go">Open →</span></a>';
      }).join('') + '</nav>' + (isAdmin ? '<section class="admin" id="admin"></section>' : '');
    if (isAdmin) renderAdmin();
    else GW.api('me').then(function (r) { if (r.expiry && r.expiry !== s.expiry) { s.expiry = r.expiry; s.name = r.name; GW.setSession(s); renderDash(s); } }).catch(function () {});
  }

  // ---------------------------------------------------------------- admin panel
  function renderAdmin() {
    var a = $('#admin');
    a.innerHTML = '<div class="admin-head"><h2>Admin panel</h2><button class="gw-btn ghost sm" type="button" id="pw-open">Change password</button></div>' +
      '<div class="stats" id="stats"></div>' +
      '<div class="gw-grid" style="grid-template-columns:minmax(0,380px) minmax(0,1fr)" id="adm-grid">' +
      '<section class="gw-card"><h2 id="frm-h">Give access</h2><form id="f-add" novalidate>' +
      '<div class="gw-field"><label for="n-mob">User mobile number</label><input class="gw-input" id="n-mob" inputmode="numeric" placeholder="10-digit mobile number" maxlength="14"></div>' +
      '<div class="gw-field"><label for="n-dev">Device ID (16 characters)</label><input class="gw-input mono" id="n-dev" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off" spellcheck="false"></div>' +
      '<div class="gw-field"><label for="n-exp">Access valid till</label><input class="gw-input" id="n-exp" type="date"></div>' +
      '<div class="quick" id="quick"><button type="button" data-m="1">+1 month</button><button type="button" data-m="3">+3 months</button><button type="button" data-m="6">+6 months</button><button type="button" data-m="12">+1 year</button></div>' +
      '<div class="gw-field"><label for="n-name">Name <span class="muted">(optional)</span></label><input class="gw-input" id="n-name" maxlength="60" placeholder="e.g. Rahul Sharma"></div>' +
      '<div class="gw-err" id="n-err" role="alert"></div>' +
      '<div style="display:flex;gap:8px"><button class="gw-btn" style="flex:1" type="submit" id="n-save">Give access</button><button class="gw-btn ghost" type="button" id="n-cancel" hidden>Cancel</button></div></form></section>' +
      '<section class="gw-card"><div class="admin-head" style="margin:0 0 10px"><h2 style="margin:0">Users</h2><input class="gw-input" id="u-q" placeholder="Search mobile, name or ID" style="max-width:240px;height:38px;font-size:14px"></div>' +
      '<div class="gw-tbl-wrap"><table class="gw-tbl utbl"><thead><tr><th>User</th><th>Device ID</th><th>Valid till</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody id="u-body"><tr><td colspan="5" class="empty"><span class="gw-spin dark" style="display:inline-block"></span></td></tr></tbody></table></div></section></div>' +
      '<section class="gw-card" id="pw-card" hidden style="margin-top:16px;max-width:520px"><h2>Change admin password</h2><form id="f-pw" novalidate>' +
      '<div class="gw-field"><label for="p-old">Current password</label><input class="gw-input" id="p-old" type="password" autocomplete="current-password"></div>' +
      '<div class="gw-field"><label for="p-new">New password</label><input class="gw-input" id="p-new" type="password" autocomplete="new-password" placeholder="At least 10 characters, letters and numbers"></div>' +
      '<div class="gw-field"><label for="p-new2">Repeat new password</label><input class="gw-input" id="p-new2" type="password" autocomplete="new-password"></div>' +
      '<div class="gw-err" id="p-err" role="alert"></div><button class="gw-btn" type="submit">Update password</button></form></section>';
    var grid = $('#adm-grid');
    var mq = window.matchMedia('(max-width:900px)');
    var fit = function () { grid.style.gridTemplateColumns = mq.matches ? '1fr' : 'minmax(0,380px) minmax(0,1fr)'; };
    fit(); mq.addEventListener ? mq.addEventListener('change', fit) : mq.addListener(fit);

    $('#n-exp').min = todayIst(); $('#n-exp').value = addMonths(1);
    $('#quick').onclick = function (e) { var b = e.target.closest('[data-m]'); if (b) $('#n-exp').value = addMonths(+b.dataset.m); };
    $('#n-dev').oninput = function () {
      var v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
      this.value = v.replace(/(.{4})(?=.)/g, '$1-');
    };
    $('#f-add').onsubmit = saveUser;
    $('#n-cancel').onclick = resetForm;
    $('#u-q').oninput = drawUsers;
    $('#pw-open').onclick = function () { var c = $('#pw-card'); c.hidden = !c.hidden; if (!c.hidden) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#p-old').focus(); } };
    $('#f-pw').onsubmit = changePw;
    $('#u-body').onclick = rowAction;
    loadUsers();
  }
  function loadUsers() {
    GW.api('listUsers').then(function (r) { users = r.users || []; drawUsers(); })
      .catch(function (e) { $('#u-body').innerHTML = '<tr><td colspan="5" class="empty">' + esc(e.message) + '</td></tr>'; });
  }
  function status(u) {
    if (u.status === 'blocked') return ['Paused', 'amber'];
    var d = daysLeft(u.expiry);
    if (d < 0) return ['Expired', 'red'];
    if (d <= 7) return [d + ' day' + (d === 1 ? '' : 's') + ' left', 'amber'];
    return ['Active', 'green'];
  }
  function drawUsers() {
    var act = 0, exp = 0, soon = 0;
    users.forEach(function (u) { var s = status(u)[0]; if (s === 'Expired') exp++; else if (s === 'Paused') {} else { act++; if (s !== 'Active') soon++; } });
    $('#stats').innerHTML = [[users.length, 'Total users'], [act, 'Active'], [soon, 'Expiring in 7 days'], [exp, 'Expired']].map(function (x) {
      return '<div class="stat"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>';
    }).join('');
    var q = ($('#u-q').value || '').toLowerCase().replace(/[-\s]/g, '');
    var list = users.filter(function (u) { return !q || (u.mobile + u.deviceId + (u.name || '')).toLowerCase().replace(/\s/g, '').indexOf(q) >= 0; });
    $('#u-body').innerHTML = list.length ? list.map(function (u, i) {
      var st = status(u), k = users.indexOf(u);
      return '<tr><td><b>' + esc(u.name || 'User') + '</b><br><span class="muted mono">' + esc(u.mobile) + '</span></td>' +
        '<td class="mono">' + GW.prettyId(u.deviceId) + '</td><td>' + fmtDate(u.expiry) + '</td>' +
        '<td><span class="gw-chip ' + st[1] + '">' + st[0] + '</span></td>' +
        '<td class="c-act"><div class="act"><button type="button" data-a="edit" data-k="' + k + '">Edit</button>' +
        '<button type="button" data-a="extend" data-k="' + k + '">+1 month</button>' +
        '<button type="button" data-a="pause" data-k="' + k + '">' + (u.status === 'blocked' ? 'Resume' : 'Pause') + '</button>' +
        '<button type="button" class="del" data-a="del" data-k="' + k + '">Remove</button></div></td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">' + (users.length ? 'No match.' : 'No users yet. Give access using the form.') + '</td></tr>';
  }
  function resetForm() {
    editing = null; $('#f-add').reset(); $('#n-exp').value = addMonths(1);
    $('#frm-h').textContent = 'Give access'; $('#n-save').textContent = 'Give access'; $('#n-cancel').hidden = true; $('#n-err').textContent = '';
  }
  function saveUser(e) {
    e.preventDefault();
    var m = $('#n-mob').value.replace(/\D/g, '').slice(-10), d = $('#n-dev').value.replace(/[^A-Z0-9]/gi, '').toUpperCase(), x = $('#n-exp').value, err = $('#n-err');
    if (m.length !== 10) { err.textContent = 'Mobile number must have 10 digits.'; return; }
    if (d.length !== 16) { err.textContent = 'Device ID must be exactly 16 letters/numbers.'; return; }
    if (!x) { err.textContent = 'Choose the date access is valid till.'; return; }
    var dup = users.filter(function (u) { return u.mobile === m && u.deviceId === d && u !== editing; })[0];
    if (dup && !confirm('This mobile + device already has access till ' + fmtDate(dup.expiry) + '. Update it?')) return;
    var b = $('#n-save'), label = b.textContent; err.textContent = ''; btnBusy(b, true);
    var data = { mobile: m, newDeviceId: d, expiry: x, name: $('#n-name').value.trim(), status: editing ? editing.status : 'active' };
    if (editing) { data.origMobile = editing.mobile; data.origDeviceId = editing.deviceId; }
    GW.api('saveUser', data).then(function () { GW.toast(editing ? 'User updated' : 'Access given'); resetForm(); btnBusy(b, false, 'Give access'); loadUsers(); })
      .catch(function (x2) { err.textContent = x2.message; btnBusy(b, false, label); });
  }
  function rowAction(e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var u = users[+b.dataset.k]; if (!u) return;
    if (b.dataset.a === 'edit') {
      editing = u; $('#n-mob').value = u.mobile; $('#n-dev').value = GW.prettyId(u.deviceId); $('#n-exp').value = u.expiry; $('#n-name').value = u.name || '';
      $('#n-exp').min = ''; $('#frm-h').textContent = 'Edit access'; $('#n-save').textContent = 'Save changes'; $('#n-cancel').hidden = false;
      $('#f-add').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#n-exp').focus(); return;
    }
    if (b.dataset.a === 'del') {
      if (!confirm('Remove access for ' + (u.name || u.mobile) + ' on device ' + GW.prettyId(u.deviceId) + '?')) return;
      b.disabled = true;
      GW.api('deleteUser', { mobile: u.mobile, targetDeviceId: u.deviceId }).then(function () { GW.toast('Access removed'); loadUsers(); })
        .catch(function (x) { alert(x.message); b.disabled = false; });
      return;
    }
    var data = { mobile: u.mobile, newDeviceId: u.deviceId, origMobile: u.mobile, origDeviceId: u.deviceId, name: u.name || '', expiry: u.expiry, status: u.status };
    if (b.dataset.a === 'extend') {
      var base = daysLeft(u.expiry) < 0 ? new Date(Date.now() + 5.5 * 3600e3) : new Date(u.expiry + 'T00:00:00Z');
      base.setUTCMonth(base.getUTCMonth() + 1); data.expiry = base.toISOString().slice(0, 10);
    }
    if (b.dataset.a === 'pause') data.status = u.status === 'blocked' ? 'active' : 'blocked';
    b.disabled = true;
    GW.api('saveUser', data).then(function () { GW.toast(b.dataset.a === 'extend' ? 'Extended till ' + fmtDate(data.expiry) : data.status === 'blocked' ? 'Access paused' : 'Access resumed'); loadUsers(); })
      .catch(function (x) { alert(x.message); b.disabled = false; });
  }
  function changePw(e) {
    e.preventDefault();
    var o = $('#p-old').value, n = $('#p-new').value, n2 = $('#p-new2').value, err = $('#p-err'), b = this.querySelector('button[type=submit]');
    if (n !== n2) { err.textContent = 'New passwords do not match.'; return; }
    if (n.length < 10 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) { err.textContent = 'Use at least 10 characters with letters and numbers.'; return; }
    err.textContent = ''; btnBusy(b, true);
    GW.api('changePassword', { oldPassword: o, newPassword: n }).then(function () {
      alert('Password changed. Please log in again with the new password.'); GW.clearSession(); location.hash = ''; route();
    }).catch(function (x) { err.textContent = x.message; btnBusy(b, false, 'Update password'); });
  }

  // ---------------------------------------------------------------- router
  function route() {
    var bar = document.getElementById('gw-bar'); if (bar) bar.remove();
    var s = GW.session();
    if (s) { if (location.hash) history.replaceState(null, '', location.pathname); renderDash(s); window.scrollTo(0, 0); return; }
    var h = location.hash.slice(1);
    renderLogin(!GW.cfg.API_URL ? 'Setup pending: the app is not connected to its backend yet.' : h === 'expired' ? 'Your session ended. Please log in again.' : h === 'login' ? 'Please log in to continue.' : '');
  }
  route();
})();
</script>
</body>
</html>
